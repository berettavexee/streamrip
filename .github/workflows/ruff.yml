name: Ruff

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run ruff check
        uses: astral-sh/ruff-action@v3

      # Second step rather than a combined one: a lint failure and a formatting
      # failure are different problems, and the log should say which it is.
      - name: Run ruff format --check
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"
