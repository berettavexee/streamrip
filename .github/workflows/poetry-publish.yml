# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build and publish to pypi
      uses: JRubics/poetry-publish@v1.17
      with:
        pypi_token: ${{ secrets.PYPI_TOKEN }}
        # L'action embarque sa propre Poetry. Les métadonnées du projet sont au
        # format PEP 621 ([project]), que seule Poetry 2.x sait lire : sans cette
        # contrainte, une image livrant encore Poetry 1.x échouerait à la
        # construction, et seulement au moment d'une publication.
        poetry_version: ">=2.0.0"
