# Métadonnées au format PEP 621 ([project]) plutôt qu'au format historique
# ([tool.poetry]) : Poetry 2.x déprécie le second et le signale à chaque appel.
# Les contraintes sont donc écrites en PEP 508 — les caret ranges de Poetry n'y
# existent pas — avec leur traduction exacte : `^1.2.3` vaut `>=1.2.3,<2.0.0`,
# et sur une version 0.x c'est le mineur qui borne (`^0.7.2` => `<0.8.0`).
[project]
name = "streamrip"
version = "2.2.1"
description = "A fast, all-in-one music downloader for Qobuz, Deezer, Tidal, and SoundCloud"
authors = [{ name = "nathom", email = "nathanthomas707@gmail.com" }]
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["hi-res", "free", "music", "download"]
# Deux changements par rapport au bloc historique :
#   - le classifier de licence disparaît, PEP 639 le remplace par le champ
#     `license` ci-dessus et le déclarer deux fois est une erreur ;
#   - les classifiers « Programming Language :: Python » sont désormais écrits
#     à la main. En mode [tool.poetry], Poetry les dérivait de la contrainte
#     python ; en mode PEP 621 il ne dérive plus rien, et les omettre les
#     retirerait silencieusement de la fiche PyPI. À tenir à jour avec
#     `requires-python`.
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10,<4.0"
dependencies = [
  "mutagen>=1.45.1,<2.0.0",
  "tomlkit>=0.7.2,<0.8.0",
  "pathvalidate>=2.4.1,<3.0.0",
  # `platform = 'darwin|linux'` de Poetry devient un marqueur d'environnement.
  "simple-term-menu>=1.2.1,<2.0.0; sys_platform == 'darwin' or sys_platform == 'linux'",
  "pick>=2,<3; sys_platform == 'win32' or sys_platform == 'cygwin'",
  "windows-curses>=2.2.0,<3.0.0; sys_platform == 'win32' or sys_platform == 'cygwin'",
  "Pillow>=9,<13",
  "deezer-py==1.3.6",
  "pycryptodomex>=3.10.1,<4.0.0",
  "appdirs>=1.4.4,<2.0.0",
  "m3u8>=0.9.0,<0.10.0",
  "aiofiles>=0.7,<0.8",
  "aiohttp>=3.9,<4.0",
  "aiodns>=3.0.0,<4.0.0",
  "aiolimiter>=1.1.0,<2.0.0",
  "rich>=13.6.0,<14.0.0",
  "click-help-colors>=0.9.2,<0.10.0",
]

[project.optional-dependencies]
ssl = ["certifi>=2025.1.31,<2026.0.0"]

[project.scripts]
rip = "streamrip.rip:rip"

[project.urls]
Homepage = "https://github.com/nathom/streamrip"
Repository = "https://github.com/nathom/streamrip"
"Bug Reports" = "https://github.com/nathom/streamrip/issues"

# Ce qui reste ici est spécifique à Poetry et n'a pas d'équivalent PEP 621 :
# la disposition des paquets et les fichiers embarqués dans la distribution.
[tool.poetry]
include = ["src/config.toml"]
packages = [{ include = "streamrip" }]

[tool.poetry.group.dev.dependencies]
# types-click et types-Pillow ont été retirés : ce sont des stubs pour un
# type-checker qui n'existe nulle part ici (ni mypy en dépendance, ni étape de
# typage dans le CI), et ils étaient restés sur des majeures obsolètes —
# click 7 alors que le projet utilise click 8.
# ruff couvre à lui seul isort (`I`), le cœur de flake8 (`E`/`F`) et le
# formatage black (cf. [tool.ruff.format]) : les trois outils ont été retirés.
ruff = ">=0.16"
# vulture est déclaré ici parce que sa configuration l'est aussi
# ([tool.vulture] + .vulture_whitelist.py) : sans ça, `poetry install` ne le
# fournit pas et l'outil ne vit que dans les venvs où quelqu'un l'a pip-installé.
vulture = "^2.16"
setuptools = "^83.0.0"
pytest = "^9.0"
pytest-mock = "^3.11.1"
pytest-asyncio = "^0.21.1"
pytest-recording = "^0.13"
pytest-cov = "^6.0"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
log_level = "DEBUG"
asyncio_mode = 'auto'
log_cli = true

[build-system]
# poetry-core 2.x : c'est la version qui sait lire les métadonnées PEP 621.
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# Le whitelist vulture contient des noms non définis à dessein (F821).
extend-exclude = [".vulture_whitelist.py"]
# Les règles preview sont activées pour absorber au fil de l'eau celles qui
# seront stabilisées plus tard, plutôt que d'encaisser un CI rouge à chaque
# bump majeur de ruff (cf. RUF036 arrivé avec 0.16).
preview = true

[tool.vulture]
paths = ["streamrip", ".vulture_whitelist.py"]
min_confidence = 60

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = ["E4", "E7", "E9", "F", "I", "ASYNC", "N", "RUF", "commented-out-code"]
ignore = [
  # Les fakes des tests doivent être `async` pour matcher l'interface mockée,
  # même quand leur corps n'attend rien.
  "unused-async",
  # Le préfixe `_` marque ici une variable privée/interne, pas une variable
  # inutilisée : la relire est normal (cf. dummy-variable-rgx ci-dessous).
  "used-dummy-variable",
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Le `preview = true` de [tool.ruff] est là pour le LINTER — voir le commentaire
# là-bas. Il s'appliquerait aussi au formateur, dont les styles preview ne sont
# pas figés : formater en preview graverait une mise en forme qui rebouge au
# prochain bump de ruff (p. ex. le « hugging » `f(*[\n ... \n])`, absent du style
# stable et du code upstream). Le formateur est donc explicitement remis en
# stable ici. Ne pas retirer cette ligne sans reformater tout le dépôt.
preview = false

# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.coverage.run]
source = ["streamrip"]
omit = ["tests/*"]

[tool.coverage.report]
omit = ["tests/*"]

